services:
  db:
    image: postgres:15
    container_name: postgres
    networks:
      - my_network
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    container_name: tg-mini-app-redis
    networks:
      - my_network
    ports:
      - "6379:6379"

  backend:
    build:
      context: backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - media:/media
      - ./backend:/backend   # live code — изменения применяются без пересборки
    command: sh /backend/entrypoint.sh
    networks:
      - my_network
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - SERVER_RELOAD=true   # uvicorn перезапускается при изменении файлов
    restart: unless-stopped

  bot:
    build:
      context: bot
    container_name: bot
    ports:
      - "8001:8001"
    networks:
      - my_network
    depends_on:
      - backend
    volumes:
      - ./bot:/bot           # live code
    environment:
      - BACKEND_HOST=http://backend:8000
    env_file:
      - .env

  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # изолировать node_modules от хоста
    ports:
      - "5173:5174"
    networks:
      - my_network
    environment:
      # Для локального браузера: http://localhost:8000
      # Для тестирования в Telegram через тоннель: URL второго тоннеля на порт 8000
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - BACKEND_INTERNAL_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - my_network
    depends_on:
      - db
    restart: always

volumes:
  media:
  postgres_data_dev:
  frontend_node_modules:

networks:
  my_network:

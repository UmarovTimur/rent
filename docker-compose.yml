services:
  db:
    image: postgres:15
    container_name: postgres
    networks:
      - my_network
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5438:5432"

  redis:
    image: redis:7
    restart: always
    container_name: tg-mini-app-redis
    networks:
      - my_network
    ports:
      - "6379:6379"

  backend:
    build:
      context: backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - media:/media
      - ./backend:/backend   # live code — изменения применяются без пересборки
    networks:
      - my_network
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - SERVER_RELOAD=true   # uvicorn перезапускается при изменении файлов
    restart: unless-stopped

  bot:
    build:
      context: bot
    container_name: bot
    ports:
      - "8002:8001"
    networks:
      - my_network
    depends_on:
      - backend
    volumes:
      - ./bot:/bot           # live code
    environment:
      - BACKEND_HOST=http://backend:8000
    env_file:
      - .env

  celery:
    build:
      context: backend
    container_name: celery
    command: sh -c "celery -A src.celery_app:celery_app worker -B --loglevel=info"
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/backend
    env_file:
      - .env
    networks:
      - my_network
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # изолировать node_modules от хоста
    networks:
      - my_network
    environment:
      - VITE_API_BASE_URL=
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "5173:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - my_network

  adminer:
    image: adminer
    ports:
      - "8083:8080"
    networks:
      - my_network
    depends_on:
      - db
    restart: always

volumes:
  media:
  postgres_data_dev:
  frontend_node_modules:

networks:
  my_network:
